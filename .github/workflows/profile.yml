name: refresh profile visuals

# Every number in the profile SVGs is fetched from the GitHub API at render
# time. Nothing is hand-written, so nothing can drift out of date or quietly
# become a lie.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/render_profile.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: check the renderer still parses
        run: python -m py_compile tools/render_profile.py

      - name: render both boards from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/render_profile.py --out docs

      - name: fail loudly if the render produced nothing
        run: |
          set -eu
          for f in docs/hero-dark.svg docs/hero-light.svg \
                   docs/metrics-dark.svg docs/metrics-light.svg \
                   docs/data/live.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no change since the last run"
          else
            git commit -m "chore: refresh profile visuals from the GitHub API"
            git push
          fi
