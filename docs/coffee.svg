<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" fill="none">
  <defs>
    <linearGradient id="cupG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="cupb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="380" height="380" fill="none"/>
  <circle cx="190" cy="190" r="130" fill="url(#cupG)" opacity="0.1" filter="url(#cupb)"/>

  <!-- coffee cup -->
  <g stroke="url(#cupG)" stroke-width="5" stroke-linecap="round" fill="none" stroke-linejoin="round">
    <path d="M110 160 L140 250 L240 250 L270 160 Z"/>
    <path d="M270 170 L300 175 C310 195 305 215 295 220 L270 220"/>
    <path d="M150 250 L145 300 L235 300 L230 250"/>
    <path d="M155 300 A40 40 0 0 0 225 300" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- handle line accents -->
  <path d="M270 180 L285 190" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M272 205 L290 215" stroke="#ff2e97" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- rising steam -->
  <g stroke="#a855f7" stroke-width="4" stroke-linecap="round">
    <path d="M160 150 C150 130 170 130 160 110" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M190 150 C180 126 200 126 190 100" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M220 150 C210 130 230 130 220 110" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>