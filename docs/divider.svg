<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="22" viewBox="0 0 1200 22" fill="none">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.25" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="0.75" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#ffb86c"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="20" y1="11" x2="1180" y2="11" stroke="url(#rainbow)" stroke-width="2" filter="url(#g)"/>
  <rect x="588" y="4" width="24" height="14" rx="2" fill="#0d1117" stroke="url(#rainbow)" stroke-width="1.4" transform="rotate(45 600 11)">
    <animate attributeName="transform" values="rotate(0 600 11);rotate(360 600 11)" dur="6s" repeatCount="indefinite" type="rotate" additive="sum"/>
  </rect>
  <circle cx="600" cy="11" r="2.5" fill="#e879f9">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>