<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jinhui Chen — open source contributor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#101a3e;#0b1020" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#141d46">
        <animate attributeName="stop-color" values="#141d46;#24306a;#141d46" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d2a38">
        <animate attributeName="stop-color" values="#0d2a38;#0f4a56;#0d2a38" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8aa2ff" opacity="0.16"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#3fb6a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05">
        <animate attributeName="offset" values="0;1" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#sheen)"/>

  <!-- faint oversized glyph for depth -->
  <text x="960" y="250" font-family="Consolas, Menlo, monospace" font-size="220" font-weight="700" fill="#ffffff" opacity="0.04">>_</text>

  <rect x="80" y="84" width="64" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="148" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#e8edf7" letter-spacing="0.5">Jinhui Chen</text>

  <text x="80" y="192" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="22" fill="#aebdda">把只有 Windows 才踩得到的坑修好，送回上游</text>

  <text x="80" y="224" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#7d8db0">Open source contributor · Python / Go · witr · nvm · k8sgpt-operator · llm tooling</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <rect x="80" y="246" width="118" height="28" rx="14" fill="#ffffff" opacity="0.07"/>
    <rect x="80" y="246" width="118" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="139" y="265" text-anchor="middle" fill="#cdd9f0">5 PRs merged</text>

    <rect x="210" y="246" width="104" height="28" rx="14" fill="#ffffff" opacity="0.07"/>
    <rect x="210" y="246" width="104" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="262" y="265" text-anchor="middle" fill="#cdd9f0">25 PRs open</text>

    <rect x="326" y="246" width="216" height="28" rx="14" fill="#ffffff" opacity="0.07"/>
    <rect x="326" y="246" width="216" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="434" y="265" text-anchor="middle" fill="#cdd9f0">cp936 · symlinks · flaky CI · hermetic tests</text>
  </g>
</svg>
