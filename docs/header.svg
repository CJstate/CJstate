<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jinhui Chen — small tools and the bugs CI cannot see">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16">
        <animate attributeName="stop-color" values="#070b16;#0d1430;#070b16" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#111b3d">
        <animate attributeName="stop-color" values="#111b3d;#1d2a5c;#111b3d" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0a2430">
        <animate attributeName="stop-color" values="#0a2430;#0d3d49;#0a2430" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd4b4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2fd4b4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8fa8ff" opacity="0.13"/>
    </pattern>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.5" stop-color="#7cc7ff"/>
      <stop offset="1" stop-color="#3fd0b0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#3fd0b0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd0b0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.045">
        <animate attributeName="offset" values="-0.2;1.2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="330" fill="url(#glowA)"/>
  <circle cx="180" cy="300" r="290" fill="url(#glowB)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#sheen)"/>

  <!-- decorative terminal frame, right -->
  <g opacity="0.5">
    <rect x="856" y="86" width="286" height="148" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="856" y1="116" x2="1142" y2="116" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="878" cy="101" r="4" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="894" cy="101" r="4" fill="#ffd166" opacity="0.5"/>
    <circle cx="910" cy="101" r="4" fill="#3fd0b0" opacity="0.5"/>
    <g font-family="Consolas, Menlo, ui-monospace, monospace" font-size="14">
      <text x="880" y="146" fill="#9fb4dd">$ pytest -p no:randomly</text>
      <text x="880" y="172" fill="#5f7396">.....</text>
      <text x="880" y="198" fill="#3fd0b0">5 passed</text>
      <text x="880" y="220" fill="#5f7396"># order was the bug</text>
    </g>
  </g>

  <rect x="80" y="92" width="72" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="156" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#eaf1ff" letter-spacing="0.2">Jinhui Chen</text>

  <text x="80" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="23" fill="#b9c8e6">小的工具，以及 CI 看不见的 bug</text>

  <text x="80" y="236" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8195b8">Python · Go · zero-dependency tooling · agent harness · LLM evaluation</text>

  <line x1="80" y1="264" x2="700" y2="264" stroke="url(#rule)" stroke-width="1.5"/>
</svg>
