<text x="40" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#405260">Most of what I do is read a system until it tells me how it breaks. The bugs I end up</text>
<text x="40" y="217" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#405260">fixing are the quiet ones: a symlink Git for Windows checks out as a 16-byte text file,</text>
<text x="40" y="238" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#405260">a locale encoding that eats the file you just wrote, a secret a tool promises to redact</text>
<text x="40" y="259" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#405260">and then writes to disk anyway. None of them can fail in CI, because CI is the machine</text>
<text x="40" y="280" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#405260">that already has the thing the user does not.</text>
