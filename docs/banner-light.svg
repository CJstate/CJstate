<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f6f8fa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="280" fill="url(#grid)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="150" cy="80" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>
  <circle cx="1050" cy="200" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>

  <!-- Main text -->
  <text x="600" y="135" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="48" font-weight="700" fill="url(#textGrad)" filter="url(#glowStrong)">CJstate</text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#656d76" letter-spacing="2">Independent Developer · Backend Architect · AI Engineer</text>

  <!-- Divider line -->
  <line x1="400" y2="215" x2="800" y1="215" stroke="url(#accentGrad)" stroke-width="2" opacity="0.7"/>

  <!-- Tags -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">
    <text x="600" y="245" text-anchor="middle">
      <tspan fill="#06b6d4">Go</tspan> <tspan>•</tspan>
      <tspan fill="#9333ea">Python</tspan> <tspan>•</tspan>
      <tspan fill="#db2777">Rust</tspan> <tspan>•</tspan>
      <tspan fill="#f59e0b">TypeScript</tspan> <tspan>•</tspan>
      <tspan fill="#2563eb">Kubernetes</tspan> <tspan>•</tspan>
      <tspan fill="#059669">AI/ML</tspan>
    </text>
  </g>

  <!-- Terminal prompt decoration -->
  <g transform="translate(100, 20)" opacity="0.5">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#06b6d4">$ whoami</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9333ea">CJstate</text>
    <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="14" fill="#06b6d4">$ ./ship --now</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="14" fill="#db2777">building... ✓</text>
  </g>

  <g transform="translate(950, 20)" opacity="0.5" text-anchor="end">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#06b6d4">$ git push origin main</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9333ea">deploying... ✓</text>
    <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="14" fill="#06b6d4">$ make test</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="14" fill="#059669">all passed ✓</text>
  </g>
</svg>