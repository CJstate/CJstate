<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="280" fill="url(#grid)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="150" cy="80" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>
  <circle cx="1050" cy="200" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.2" filter="url(#glow)"/>

  <!-- Main text -->
  <text x="600" y="135" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="48" font-weight="700" fill="url(#textGrad)" filter="url(#glowStrong)">CJstate</text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#8b949e" letter-spacing="2">Independent Developer · Backend Architect · AI Engineer</text>

  <!-- Divider line -->
  <line x1="400" y2="215" x2="800" y1="215" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Tags -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">
    <text x="600" y="245" text-anchor="middle">
      <tspan fill="#22d3ee">Go</tspan> <tspan>•</tspan>
      <tspan fill="#a855f7">Python</tspan> <tspan>•</tspan>
      <tspan fill="#ec4899">Rust</tspan> <tspan>•</tspan>
      <tspan fill="#f59e0b">TypeScript</tspan> <tspan>•</tspan>
      <tspan fill="#3b82f6">Kubernetes</tspan> <tspan>•</tspan>
      <tspan fill="#10b981">AI/ML</tspan>
    </text>
  </g>

  <!-- Terminal prompt decoration -->
  <g transform="translate(100, 20)" opacity="0.4">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22d3ee">$ whoami</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a855f7">CJstate</text>
    <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22d3ee">$ ./ship --now</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ec4899">building... ✓</text>
  </g>

  <g transform="translate(950, 20)" opacity="0.4" text-anchor="end">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22d3ee">$ git push origin main</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a855f7">deploying... ✓</text>
    <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22d3ee">$ make test</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="14" fill="#10b981">all passed ✓</text>
  </g>
</svg>