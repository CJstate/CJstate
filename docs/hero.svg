<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jinhui Chen — the bugs CI cannot see">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0d2733"/>
    </linearGradient>
    <pattern id="hdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8fa8ff" opacity="0.12"/>
    </pattern>
    <linearGradient id="haccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#3fd0b0"/>
    </linearGradient>
    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#3fd0b0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd0b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#hbg)"/>
  <circle cx="1040" cy="40" r="300" fill="url(#hglow)"/>
  <rect width="1200" height="300" fill="url(#hdots)"/>

  <text x="952" y="248" font-family="Consolas, Menlo, monospace" font-size="190" font-weight="700" fill="#ffffff" opacity="0.035">>_</text>

  <rect x="80" y="86" width="64" height="4" rx="2" fill="url(#haccent)"/>

  <text x="80" y="148" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="48" font-weight="700" fill="#eaf1ff" letter-spacing="0.3">Jinhui Chen</text>

  <text x="80" y="192" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="23" fill="#b9c8e6">绿灯和用户报错之间那道缝，就是我在找的东西</text>

  <text x="80" y="226" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8195b8">Python · Go · zero-dependency tooling · agent harness · LLM evaluation gate · cp936 survivor</text>

  <line x1="80" y1="254" x2="760" y2="254" stroke="url(#hrule)" stroke-width="1.5"/>
