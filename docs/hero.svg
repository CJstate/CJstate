<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#03060d"/>
    <stop offset="0.6" stop-color="#0a1120"/>
    <stop offset="1" stop-color="#101a30"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
