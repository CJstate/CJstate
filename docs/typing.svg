<svg xmlns="http://www.w3.org/2000/svg" width="700" height="86" viewBox="0 0 700 86" role="img" aria-label="taglines">

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#03060d"/>
    <stop offset="0.6" stop-color="#0a1120"/>
    <stop offset="1" stop-color="#101a30"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"/>
    <stop offset="0.5" stop-color="#6ea8ff"/>
    <stop offset="1" stop-color="#bd34fe"/>
    <animate attributeName="x1" values="-0.4;1.4;-0.4" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.6;2.4;0.6" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ffa3"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0.75"/>
    <stop offset="0.6" stop-color="#bd34fe" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#bd34fe" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="700" height="86" fill="none"/>
<text x="12" y="52" font-size="19" font-weight="600" fill="#00ffa3" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace">&gt;</text>
<text x="34" y="52" font-size="19" font-weight="600" fill="#00e5ff" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" opacity="0">Fixing the bugs CI never catches<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.040;0.252;0.333;1" dur="13.5s" repeatCount="indefinite"/></text><text x="34" y="52" font-size="19" font-weight="600" fill="#00e5ff" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" opacity="0">Go infrastructure · Kubernetes tooling · Prometheus<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.373;0.585;0.667;1" dur="13.5s" repeatCount="indefinite"/></text><text x="34" y="52" font-size="19" font-weight="600" fill="#00e5ff" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" opacity="0">Test-first, every time<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.707;0.919;1.000;1" dur="13.5s" repeatCount="indefinite"/></text>
<line x1="12" y1="70" x2="688" y2="70" stroke="#1b2b4a" stroke-width="1"/>
<rect x="12" y="69" width="90" height="2" rx="1" fill="url(#sweep)">
  <animate attributeName="x" values="12;598;12" dur="9s" repeatCount="indefinite"/>
</rect>
</svg>
