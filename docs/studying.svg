<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" fill="none">
  <defs>
    <linearGradient id="bkG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="bgl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sgl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="380" height="380" fill="none"/>
  <circle cx="190" cy="190" r="130" fill="url(#bkG)" opacity="0.1" filter="url(#bgl)"/>

  <!-- open book -->
  <g transform="translate(190 175)" stroke="url(#bkG)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M-70 -30 C-40 -45 -10 -45 0 -30 C10 -45 40 -45 70 -30 L70 55 C40 40 10 40 0 55 C-10 40 -40 40 -70 55 Z"/>
    <line x1="0" y1="-30" x2="0" y2="55"/>
    <line x1="-50" y1="-12" x2="-18" y2="-12" stroke-width="2.5" opacity="0.85"/>
    <line x1="-50" y1="8" x2="-18" y2="8" stroke-width="2.5" opacity="0.7"/>
    <line x1="-50" y1="28" x2="-18" y2="28" stroke-width="2.5" opacity="0.55"/>
    <line x1="18" y1="-12" x2="50" y2="-12" stroke-width="2.5" opacity="0.85"/>
    <line x1="18" y1="8" x2="50" y2="8" stroke-width="2.5" opacity="0.7"/>
    <line x1="18" y1="28" x2="50" y2="28" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- floating sparkles -->
  <g>
    <text x="70" y="70" font-size="22" fill="#00e5ff" filter="url(#sgl)">✦</text>
    <text x="295" y="95" font-size="16" fill="#ff2e97" filter="url(#sgl)">✦</text>
    <text x="300" y="305" font-size="20" fill="#a855f7" filter="url(#sgl)">✦</text>
    <text x="62" y="300" font-size="14" fill="#00e5ff" filter="url(#sgl)">✦</text>
  </g>
</svg>