<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <!-- deep space background, slowly breathing -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06070d">
        <animate attributeName="stop-color" values="#06070d;#0a0d18;#06070d" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#090c14">
        <animate attributeName="stop-color" values="#090c14;#0e1220;#090c14" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0b0f1c">
        <animate attributeName="stop-color" values="#0b0f1c;#141a2e;#0b0f1c" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- neon title gradient: cyan -> violet -> magenta -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#a855f7;#ff2e97;#00e5ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ff2e97;#00e5ff;#a855f7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2e97">
        <animate attributeName="stop-color" values="#ff2e97;#00e5ff;#a855f7;#ff2e97" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- cyan frame -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- magenta frame -->
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <!-- glow filters -->
    <filter id="glowStrong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- radial glows -->
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMag" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ff2e97" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </radialGradient>

    <!-- sweeping light band -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e879f9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>

    <!-- hairline -->
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- breathing neon glows -->
  <circle cx="160" cy="80" r="170" fill="url(#glowViolet)">
    <animate attributeName="r" values="150;190;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="120" r="150" fill="url(#glowCyan)">
    <animate attributeName="r" values="130;170;130" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="330" r="150" fill="url(#glowMag)">
    <animate attributeName="r" values="120;165;120" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- faint cyber grid -->
  <g stroke="#00e5ff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>
  <g stroke="#ff2e97" stroke-opacity="0.04" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="360">
      <animate attributeName="stroke-opacity" values="0.02;0.08;0.02" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8">
      <animate attributeName="stroke-opacity" values="0.03;0.1;0.03" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- rotating neon monogram frames -->
  <g transform="translate(600 104)">
    <rect x="-40" y="-40" width="80" height="80" rx="16" stroke="url(#cyan)" stroke-width="1.5" fill="none" stroke-dasharray="7 4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite" additive="sum"/>
    </rect>
    <rect x="-30" y="-30" width="60" height="60" rx="12" stroke="url(#mag)" stroke-width="1" fill="none" stroke-dasharray="4 5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite" additive="sum"/>
    </rect>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="central"
          font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace"
          font-weight="700" font-size="34" fill="url(#neon)" filter="url(#glowSoft)">CJ</text>
  </g>

  <!-- main title -->
  <text x="600" y="208" text-anchor="middle"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace"
        font-weight="700" font-size="62" letter-spacing="22" fill="url(#neon)" filter="url(#glowStrong)">
    CJSTATE
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1.4s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="600" y="256" text-anchor="middle"
        font-family="'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="400" font-size="19" letter-spacing="5" fill="#aab6cf">
    build the future · ship the code · break the limits
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="1.4s" fill="freeze"/>
  </text>

  <!-- status bar -->
  <text x="600" y="312" text-anchor="middle"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace"
        font-weight="400" font-size="14" letter-spacing="2" fill="#61708a">
    $ whoami --verbose
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="1.4s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="744" y="296" width="3" height="20" rx="1" fill="#00e5ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <g fill="#e879f9">
    <circle cx="130" cy="70" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="70;50;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="60" r="2.2" opacity="0.4">
      <animate attributeName="cy" values="60;92;60" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="280" r="1.5" opacity="0.6" fill="#00e5ff">
      <animate attributeName="cy" values="280;254;280" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.6;0.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="310" r="1.9" opacity="0.5" fill="#ff2e97">
      <animate attributeName="cy" values="310;286;310" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="40" r="1.4" opacity="0.4">
      <animate attributeName="cy" values="40;58;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="340" r="1.7" opacity="0.5">
      <animate attributeName="cy" values="340;316;340" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- hairlines -->
  <rect x="340" y="336" width="520" height="1" fill="url(#hair)"/>
  <rect x="60" y="22" width="1080" height="1" fill="url(#hair)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- sweeping light band -->
  <rect width="320" height="360" fill="url(#sweep)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" from="-360 0" to="1240 0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>