<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <!-- flowing background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0d12">
        <animate attributeName="stop-color" values="#0a0d12;#0d1117;#0a0d12" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#10161f;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0f1720">
        <animate attributeName="stop-color" values="#0f1720;#0d1117;#0f1720" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- flowing gold accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99a3d">
        <animate attributeName="stop-color" values="#c99a3d;#f0d589;#c99a3d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f0d589">
        <animate attributeName="stop-color" values="#f0d589;#c99a3d;#f0d589" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- hairline -->
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a853" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4a853" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
    </linearGradient>

    <!-- glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a853" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#d4a853" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>

    <!-- sweep light band -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a853" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5e6c0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- breathing glows -->
  <circle cx="180" cy="90" r="160" fill="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="140" fill="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- faint grid -->
  <g stroke="#d4a853" stroke-opacity="0.05" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="360">
      <animate attributeName="stroke-opacity" values="0.03;0.08;0.03" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="180" x2="1200" y2="360">
      <animate attributeName="stroke-opacity" values="0.04;0.09;0.04" dur="11s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- floating particles -->
  <g fill="#f0d589">
    <circle cx="120" cy="80" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="60" r="2.2" opacity="0.4">
      <animate attributeName="cy" values="60;88;60" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="270" r="1.5" opacity="0.6">
      <animate attributeName="cy" values="270;246;270" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.6;0.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="320" r="1.9" opacity="0.5">
      <animate attributeName="cy" values="320;298;320" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="44" r="1.4" opacity="0.4">
      <animate attributeName="cy" values="44;62;44" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="344" r="1.7" opacity="0.5">
      <animate attributeName="cy" values="344;320;344" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- top & bottom hairline -->
  <rect x="360" y="26" width="480" height="1" fill="url(#hair)"/>
  <rect x="200" y="332" width="800" height="1" fill="url(#hair)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating dashed monogram frame -->
  <g transform="translate(600 128)">
    <rect x="-42" y="-42" width="84" height="84" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite" additive="sum"/>
    </rect>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="central"
          font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace"
          font-weight="600" font-size="40" fill="url(#accent)">CJ</text>
  </g>

  <!-- name -->
  <text x="600" y="248" text-anchor="middle"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace"
        font-weight="600" font-size="46" letter-spacing="16" fill="#f0f6fc">
    CJSTATE
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1.6s" fill="freeze"/>
  </text>

  <!-- slogan -->
  <text x="600" y="292" text-anchor="middle"
        font-family="'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="400" font-size="18" letter-spacing="3" fill="#8b949e">
    build · ship · learn
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="1.6s" fill="freeze"/>
  </text>

  <!-- blinking cursor after slogan -->
  <rect x="690" y="274" width="3" height="24" rx="1" fill="#d4a853">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- sweeping light band -->
  <rect width="300" height="360" fill="url(#sweep)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="-350 0" to="1250 0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
