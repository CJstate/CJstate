<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a853"/>
      <stop offset="1" stop-color="#f0d589"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a853" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4a853"/>
      <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a853" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="180" fill="url(#glow)"/>
  <circle cx="150" cy="280" r="140" fill="url(#glow)"/>

  <g stroke="#d4a853" stroke-opacity="0.05" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="0" y1="160" x2="1200" y2="320"/>
  </g>

  <rect x="360" y="24" width="480" height="1" fill="url(#hair)"/>

  <g transform="translate(600 118)">
    <rect x="-40" y="-46" width="80" height="80" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace"
          font-weight="600" font-size="40" fill="url(#accent)">CJ</text>
  </g>

  <text x="600" y="226" text-anchor="middle"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace"
        font-weight="600" font-size="44" letter-spacing="14" fill="#f0f6fc">CJSTATE</text>

  <text x="600" y="266" text-anchor="middle"
        font-family="'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="400" font-size="17" letter-spacing="3" fill="#8b949e">build · ship · learn</text>

  <rect x="200" y="296" width="800" height="1" fill="url(#hair)"/>
</svg>
