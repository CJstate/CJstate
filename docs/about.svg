<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" fill="none">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="gb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="380" height="380" fill="none"/>
  <circle cx="190" cy="190" r="120" fill="url(#orb)" opacity="0.12" filter="url(#gb)"/>
  <g transform="translate(190 190)">
    <circle r="105" stroke="url(#ring)" stroke-width="1.5" fill="none" stroke-dasharray="6 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" stroke="url(#ring)" stroke-width="1.2" fill="none" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" stroke="#00e5ff" stroke-opacity="0.7" stroke-width="1" fill="none"/>
    <text x="0" y="4" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono','Fira Code',Consolas,monospace" font-weight="700" font-size="38" fill="url(#orb)" filter="url(#gs)">&lt;/&gt;</text>
    <circle r="4" fill="#ff2e97" filter="url(#gs)">
      <animateTransform attributeName="transform" type="rotate" from="0 105 0" to="360 105 0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#00e5ff" opacity="0.7">
    <circle cx="60" cy="80" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="120" r="2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="290" r="2.5" fill="#ff2e97"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="310" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>